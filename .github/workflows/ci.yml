name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Tracker integrity — fast early signal that the frozen PLAN (103 phases / 21 tracks) is intact
  # and SAMPLE-REPORT.md is in sync with the engine. Full enforcement is in tests/test_trackers.py.
  trackers:
    name: tracker integrity (plan preserved + sample fresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Bootstrap core profile
        run: python tools/dev.py bootstrap --profile core --current
      - name: Check trackers (plan not shrunk; sample fresh)
        run: python tools/dev.py run --profile core --command tracker-integrity

  # Cross-platform / cross-Python matrix — CORE + dev only (no optional solvers,
  # which have no Windows/macOS wheels). Proves the engine installs and passes
  # everywhere the project claims to support (Python 3.10–3.12 × 3 OSes).
  test:
    name: test (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Bootstrap core profile
        run: python tools/dev.py bootstrap --profile core --current
      - name: Check portable core profile
        run: python tools/dev.py check --profile core
      - name: Run the explicitly auxiliary legacy full suite
        run: python tools/dev.py run --profile core --command legacy-full

  # Linux job WITH the optional high-performance backend — exercises the J3 pysat
  # path (skipped elsewhere) and enforces the coverage gate on the full surface.
  test-solvers:
    name: test + optional solvers + coverage (ubuntu · py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the system scale generator
        run: sudo apt-get update && sudo apt-get install -y nauty
      - name: Bootstrap solver profile
        run: python tools/dev.py bootstrap --profile solver --current
      - name: Test solver profile with coverage gate
        run: python tools/dev.py check --profile solver

  # Reproducibility check — install the exact tested backend set (constraints.txt).
  reproducible:
    name: reproducible install (constraints.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Bootstrap the constrained core profile
        run: python tools/dev.py bootstrap --profile core --current
      - name: Run the constrained legacy full suite
        run: python tools/dev.py run --profile core --command legacy-full

  # Package build + install-from-wheel + CLI/MCP smoke (the real product surface).
  build:
    name: build + install-from-wheel + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build, validate, install, and smoke the wheel
        run: python tools/dev.py clean-smoke --profile release

name: docs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Bootstrap pinned docs profile
        run: python tools/dev.py bootstrap --profile docs --current
      - name: Validate documentation strictly
        run: python tools/dev.py check --profile docs
      - name: Deploy validated documentation
        run: python -m mkdocs gh-deploy --force

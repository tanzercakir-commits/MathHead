name: Release
# Tag-triggered release. Build on a clean runner, validate, then publish to PyPI via
# TRUSTED PUBLISHING (OIDC) — no long-lived API token stored anywhere.
#
# One-time setup by the maintainer (see RELEASING.md):
#   1) On PyPI: add a Trusted Publisher for this repo (workflow: release.yml, env: pypi).
#   2) On GitHub: create an environment named `pypi` (optionally with required reviewers).
# Then: bump the version, tag `vX.Y.Z`, push the tag — this workflow does the rest.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build, validate, smoke, and export release artifacts
        run: python tools/dev.py clean-smoke --profile release --artifact-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC — this is what authorizes the trusted publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

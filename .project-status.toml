schema = 1
tool_version = "2.0.0"
plan = "docs/PLAN.md"
progress = "docs/PROGRESS.md"
todo = "docs/TODO.md"
contract_manifest = "docs/contracts/manifest.toml"
todo_mode = "managed"
max_todo_items = 5

[[checks]]
name = "project-status-unit-tests"
command = "python -m unittest discover -s tests/project_status -v"
profiles = ["status"]
timeout_seconds = 120

[[checks]]
name = "reconstruction-plan"
command = "python tools/validate_reconstruction_plan.py"
profiles = ["status"]
timeout_seconds = 30

[[checks]]
name = "adoption-idempotence"
command = "python tools/project_status.py adopt --dry-run"
profiles = ["status"]
tasks = ["MH-000", "MH-001"]
timeout_seconds = 30

[[checks]]
name = "task-aware-status-contract"
command = "python -m unittest discover -s tests/project_status -p test_task_aware_status.py -v"
profiles = ["status"]
tasks = ["MH-002"]
timeout_seconds = 120

[[checks]]
name = "legacy-index"
command = "python tools/validate_legacy_index.py"
profiles = ["status"]
tasks = ["MH-005"]
timeout_seconds = 30

[[checks]]
name = "reconstruction-adrs"
command = "python tools/validate_reconstruction_adrs.py"
profiles = ["status"]
tasks = ["MH-006"]
timeout_seconds = 30

[[checks]]
name = "contract-manifest"
command = "python tools/validate_contract_manifest.py"
profiles = ["status"]
tasks = ["MH-000", "MH-002"]
timeout_seconds = 30

[[checks]]
name = "dev-environment-contract"
command = "python tools/validate_dev_environment.py"
profiles = ["status", "fast"]
tasks = ["MH-003", "MH-014"]
timeout_seconds = 180

[[checks]]
name = "legacy-baseline"
command = "python tools/validate_legacy_baseline.py"
profiles = ["status", "fast"]
tasks = ["MH-004"]
timeout_seconds = 300

[[checks]]
name = "optional-dependency-contract"
command = "python tools/validate_optional_dependencies.py --profile core"
profiles = ["status", "fast"]
tasks = ["MH-010"]
timeout_seconds = 60

[[checks]]
name = "graph-budget-contract"
command = "python tools/validate_graph_budget.py"
profiles = ["status", "fast"]
tasks = ["MH-011"]
timeout_seconds = 60

[[checks]]
name = "command-encoding-contract"
command = "python tools/validate_command_encoding.py"
profiles = ["status", "fast"]
tasks = ["MH-012"]
timeout_seconds = 60

[[checks]]
name = "live-mcp-contract"
command = "python tools/validate_live_mcp.py"
profiles = ["status", "fast"]
tasks = ["MH-013"]
timeout_seconds = 60

[[checks]]
name = "project-metadata-contract"
command = "python tools/validate_project_metadata.py"
profiles = ["status", "fast"]
tasks = ["MH-015"]
timeout_seconds = 30

[[checks]]
name = "ast-parse-contract"
command = "python tools/validate_ast_parse.py"
profiles = ["status", "fast"]
tasks = ["MH-016"]
timeout_seconds = 60

[[checks]]
name = "discovery-portfolio-contract"
command = "python tools/validate_discovery_portfolio.py"
profiles = ["status", "fast"]

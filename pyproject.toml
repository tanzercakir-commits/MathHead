[project]
name = "mathhead"
version = "1.1.0"
description = "A deterministic, first-order-logic-based math reasoning and proof engine that AI can use over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tanzercakir" }]
keywords = ["logic", "first-order-logic", "theorem-proving", "smt", "z3", "sympy",
            "mcp", "reasoning", "sat", "van-der-waerden", "schur"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Architectural decision: instead of writing a single "FOL engine" we orchestrate
# proven solvers (see DECISIONS.md ADR-0001/0002).
dependencies = [
    # Upper bounds guard the determinism/reproducibility claim (ADR-0031): a new MAJOR of a
    # backend can change output formatting or behaviour. Reproduce exactly with constraints.txt.
    "z3-solver>=4.13,<6",  # SMT solver (FOL + theories) -> logic core
    "sympy>=1.12,<2",      # CAS (symbolic computation) -> compute layer
    "mcp[cli]>=1.10,<2",   # Model Context Protocol server SDK (FastMCP). Pin <2: mcp 2.0
                           # removed mcp.server.fastmcp.FastMCP (a breaking change); the engine
                           # targets the 1.x FastMCP API. mcp-2.x migration is a follow-up.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",   # guardrail for worst-case (timeout) tests
    "pytest-cov>=5.0",       # coverage report
    "ruff>=0.6",             # lint (static guardrail)
    "hypothesis>=6.0",       # property-based tests
    # NOTE: python-sat is deliberately NOT here — it has no Windows/macOS wheels, so a
    # cross-platform `[dev]` install must not require it. Install `[dev,solvers]` (Linux)
    # to exercise the J3 high-performance-backend tests; elsewhere they skip cleanly.
]
# Optional high-performance SAT backend (CaDiCaL/Glucose/MiniSat, bundled — no system
# package; Linux wheels only). The engine works without it: `hpsolver.solve_cnf` falls back
# to the stdlib DPLL for small instances and reports an honest wall for larger ones.
solvers = [
    "python-sat>=0.1.8",
]

[project.scripts]
mathhead = "mathhead.cli:main"
mathhead-server = "mathhead.server.mcp_server:main"
mathhead-discover = "mathhead.discovery.cli:main"

[project.urls]
Homepage = "https://github.com/tanzercakir-commits/MathHead"
Repository = "https://github.com/tanzercakir-commits/MathHead"
Issues = "https://github.com/tanzercakir-commits/MathHead/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30            # no test may exceed 30 s (non-determinism/hang guardrail)

[tool.coverage.run]
source = ["src/mathhead"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85          # coverage gate (L1). Run in the Linux+solvers CI job (full surface).

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E702 (multiple statements on one line, `;`) is a deliberate, compact style in the CLI's
# argparse blocks (`p.add_argument(...); p.add_argument(...)`). Everything else is enforced.
ignore = ["E702"]

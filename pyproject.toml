[project]
name = "mathhead"
version = "0.2.0"
description = "AI'ın MCP üzerinden kullanabileceği, first-order logic temelli, deterministik matematik akıl yürütme ve ispat motoru."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tanzercakir" }]
keywords = ["logic", "first-order-logic", "theorem-proving", "smt", "z3", "sympy",
            "mcp", "reasoning", "sat", "van-der-waerden", "schur"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Mimari karar: tek bir "FOL motoru" yazmak yerine kanıtlanmış çözücüleri
# orkestre ediyoruz (bkz. DECISIONS.md ADR-0001/0002).
dependencies = [
    "z3-solver>=4.13",   # SMT çözücü (FOL + teoriler) -> mantık çekirdeği (v1)
    "sympy>=1.12",       # CAS (sembolik hesap) -> hesaplama katmanı (v2+)
    "mcp[cli]>=1.10",    # Model Context Protocol sunucu SDK'sı (FastMCP)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",   # worst-case (zaman aşımı) testleri için guardrail
    "pytest-cov>=5.0",       # kapsam (coverage) raporu
    "ruff>=0.6",             # lint (statik guardrail)
    "hypothesis>=6.0",       # property-based (özellik temelli) testler
]

[project.scripts]
mathhead = "mathhead.cli:main"
mathhead-server = "mathhead.server.mcp_server:main"

[project.urls]
Homepage = "https://github.com/tanzercakir-commits/MathHead"
Repository = "https://github.com/tanzercakir-commits/MathHead"
Issues = "https://github.com/tanzercakir-commits/MathHead/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30            # hiçbir test 30 sn'yi geçemez (non-determinizm/hang guardrail)

[tool.coverage.run]
source = ["src/mathhead"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
